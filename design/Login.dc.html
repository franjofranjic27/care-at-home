<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #FFFFFF; color: #1F2E33; font-family: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif; font-size: 18px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
    a { color: #0040F8; } a:hover { color: #0030BF; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #FFFFFF; display: flex; flex-direction: column;">
  <div style="background: #0040F8; color: #FFFFFF; padding: 64px 28px 40px 28px; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="width: 48px; height: 48px; border-radius: 14px; background: #FFFFFF; color: #0040F8; display: flex; align-items: center; justify-content: center;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path><path d="M12 17.2s-3.2-2-3.2-4.1a1.7 1.7 0 0 1 3.2-.8 1.7 1.7 0 0 1 3.2.8c0 2.1-3.2 4.1-3.2 4.1z"></path></svg>
      </div>
      <div style="font-size: 28px; font-weight: 700; letter-spacing: -0.01em;">Care@Home</div>
    </div>
    <div style="font-size: 19px; line-height: 1.35; color: #E8EDFF;">Die Untersuchung kommt zu Ihnen nach Hause.</div>
  </div>

  <div style="padding: 28px 28px 20px 28px; display: flex; flex-direction: column; gap: 20px; flex-grow: 1;">
    <h1 style="margin: 0; font-size: 28px; font-weight: 700; line-height: 1.2;">Anmelden</h1>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="font-size: 17px; font-weight: 700; color: #1F2E33;">AHV-Nummer</div>
      <div style="font-size: 16px; color: #5C6F75;">Steht auf Ihrer Versichertenkarte.</div>
      <div style="height: 60px; border: 2px solid #5C6F75; border-radius: 12px; padding: 0 18px; display: flex; align-items: center; font-size: 20px; color: #5C6F75;">756.1234.5678.97</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="font-size: 17px; font-weight: 700; color: #1F2E33;">PIN (4 Ziffern)</div>
      <div style="height: 60px; border: 2px solid #5C6F75; border-radius: 12px; padding: 0 18px; display: flex; align-items: center; justify-content: space-between; font-size: 20px; color: #5C6F75;">
        <span style="letter-spacing: 0.3em;">••••</span>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5C6F75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </div>
    </div>

    <div style="height: 64px; border-radius: 14px; background: #0040F8; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 21px; font-weight: 700;">Anmelden</div>

    <div style="display: flex; align-items: center; gap: 12px; color: #5C6F75; font-size: 17px;">
      <div style="flex-grow: 1; height: 1px; background: #D5DDE2;"></div>
      <div>Brauchen Sie Hilfe?</div>
      <div style="flex-grow: 1; height: 1px; background: #D5DDE2;"></div>
    </div>

    <div style="height: 60px; border-radius: 14px; border: 2px solid #0040F8; color: #0040F8; display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 19px; font-weight: 700;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.9.6 2.8.7a2 2 0 0 1 1.7 2z"></path></svg>
      <span>Anrufen: 0800 123 456</span>
    </div>
  </div>

  <div style="padding: 0 28px 32px 28px; color: #5C6F75; font-size: 16px; line-height: 1.4;">Ihre Spitex hilft Ihnen gerne beim ersten Anmelden.</div>
</div>
</x-dc>
</body>
</html>
