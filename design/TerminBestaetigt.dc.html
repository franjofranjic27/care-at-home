<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #FFFFFF; color: #1F2E33; font-family: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif; font-size: 18px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
    a { color: #0040F8; } a:hover { color: #0030BF; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #FFFFFF; display: flex; flex-direction: column; padding: 20px 24px 32px 24px; gap: 24px;">

  <div style="height: 48px; display: flex; align-items: center; gap: 8px; color: #0040F8; font-size: 18px; font-weight: 700;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
    <span>Zur Übersicht</span>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 18px; padding-top: 24px;">
    <div style="width: 104px; height: 104px; border-radius: 52px; background: #1B873F; color: #FFFFFF; display: flex; align-items: center; justify-content: center;">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
    </div>
    <h1 style="margin: 0; font-size: 28px; font-weight: 700; line-height: 1.2; text-align: center;">Ihr Termin ist gebucht</h1>
  </div>

  <div style="background: #E8EDFF; border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 14px;">
    <div style="font-size: 22px; font-weight: 700;">Blutentnahme zuhause</div>
    <div style="display: flex; align-items: center; gap: 12px; font-size: 19px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0040F8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18"></path></svg>
      <span>Montag, 7. September</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; font-size: 19px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0040F8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg>
      <span>08–10 Uhr</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; font-size: 19px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0040F8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="M9 22V12h6v10"></path></svg>
      <span>Bei Ihnen zuhause, Spitex Wil</span>
    </div>
  </div>

  <div style="font-size: 18px; color: #5C6F75; text-align: center; line-height: 1.4;">Wir erinnern Sie am Tag davor per SMS und Anruf.</div>

  <div style="flex-grow: 1;"></div>

  <div style="height: 64px; border-radius: 14px; background: #0040F8; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 21px; font-weight: 700;">Zur Übersicht</div>
  <div style="height: 56px; display: flex; align-items: center; justify-content: center; color: #0040F8; font-size: 18px; font-weight: 700;">Termin ändern oder absagen</div>
</div>
</x-dc>
</body>
</html>
